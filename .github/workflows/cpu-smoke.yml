name: Real CPU transcription

on:
  workflow_dispatch:
  push:
    paths:
      - transcribe.sh
      - tests/integration/**
      - .github/workflows/cpu-smoke.yml

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CPU_MODEL: tiny.en
      CPU_VENV: ${{ runner.temp }}/transcribe-smoke/cpu-venv
      XDG_CACHE_HOME: ${{ runner.temp }}/transcribe-smoke/cache
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic speech and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
      - name: Prepare CPU-only PyTorch
        run: |
          python -m venv "$CPU_VENV"
          "$CPU_VENV/bin/python" -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Exercise real transcription and validate outputs
        run: python tests/integration/cpu_smoke.py --output "$RUNNER_TEMP/transcribe-smoke/evidence"
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cpu-transcription-${{ github.sha }}
          path: ${{ runner.temp }}/transcribe-smoke/evidence
          if-no-files-found: warn
          retention-days: 14
