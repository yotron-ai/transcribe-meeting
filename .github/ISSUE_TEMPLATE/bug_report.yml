name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Do not attach recordings or other sensitive data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and command
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, engine, and version
    validations:
      required: true
